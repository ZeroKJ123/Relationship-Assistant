<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fbf2e4">
    <meta name="robots" content="noindex">
    <title>Нет соединения · Любимость</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: calc(2rem + env(safe-area-inset-top)) 1.3rem calc(2rem + env(safe-area-inset-bottom)); background: #fbf2e4; color: #3a2013; font: 1rem/1.6 system-ui, sans-serif; }
        main { max-width: 32rem; margin: 10vh auto; border-radius: 1.8rem; padding: 1.5rem; background: #fffaf2; border: 1px solid #ecd8bf; }
        h1 { font-size: 2rem; line-height: 1.2; }
        a { display: inline-flex; min-height: 44px; align-items: center; border-radius: 1rem; padding: .7rem 1rem; background: #c4530f; color: white; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 3px solid #c4530f; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <p aria-hidden="true">♥ Любимость</p>
        <h1>Нет соединения</h1>
        <p>Для личных страниц и действий нужен интернет. Здесь нет сохранённых просьб, реквизитов или балансов.</p>
        <p>Если связь пропала после отправки формы, проверьте результат в приложении после подключения. Этот экран не подтверждает выполнение действия.</p>
        <a href="/">Проверить соединение</a>
    </main>
</body>
</html>
