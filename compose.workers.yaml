# Optional local processes. Start explicitly after applying migrations and confirming Telegram bindings.
services:
    telegram-poller:
        profiles: ['telegram-polling']
        image: 'sail-starter-8.4/app'
        restart: unless-stopped
        command: ['php', 'artisan', 'telegram:poll-updates', '--no-interaction']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mariadb:
                condition: service_healthy
    telegram-worker:
        image: 'sail-starter-8.4/app'
        restart: unless-stopped
        command: ['php', 'artisan', 'queue:work', 'database', '--queue=telegram,default', '--timeout=30', '--sleep=1', '--tries=0', '--no-interaction']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mariadb:
                condition: service_healthy
    scheduler:
        image: 'sail-starter-8.4/app'
        restart: unless-stopped
        command: ['php', 'artisan', 'schedule:work', '--no-interaction']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mariadb:
                condition: service_healthy
    realtime:
        image: 'sail-starter-8.4/app'
        restart: unless-stopped
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080', '--no-interaction']
        ports:
            - '${APP_BIND_ADDRESS:-127.0.0.1}:${REVERB_PUBLIC_PORT:-8089}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mariadb:
                condition: service_healthy
